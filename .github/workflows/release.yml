name: Release

# 수동 실행 전용. 가장 높은 기존 v* 태그를 기준으로 major/minor/patch 중
# 선택한 단위만큼 버전을 올려 빌드 → Release 생성 → standalone exe 업로드를 수행합니다.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "버전 증가 단위 (예: 최신이 v0.1.0일 때 → major=v1.0.0 / minor=v0.2.0 / patch=v0.1.1)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 + 태그 (버전 산출 및 changelog용)

      - name: Compute next version
        id: ver
        shell: bash
        run: |
          # 가장 높은 SemVer 태그를 기준값으로 사용 (없으면 v0.0.0에서 시작)
          LATEST="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)"
          if [ -z "$LATEST" ]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            V="${LATEST#v}"
            MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST##*.}"
          fi
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|*) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse -q --verify "refs/tags/${NEW}" >/dev/null; then
            echo "::error::태그 ${NEW} 가 이미 존재합니다. (기준: ${LATEST:-없음}, 단위: ${{ github.event.inputs.bump }})"
            exit 1
          fi
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "이전: ${LATEST:-(없음)} → 새 버전: ${NEW}  (단위: ${{ github.event.inputs.bump }})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build standalone executable
        run: npx tauri build --no-bundle

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist-release
          EXE="$(find src-tauri/target/release -maxdepth 1 -name '*.exe' | head -n1)"
          if [ -z "$EXE" ]; then echo "::error::빌드된 exe를 찾지 못했습니다"; exit 1; fi
          echo "built: $EXE"
          cp "$EXE" "dist-release/WinTamer-${{ steps.ver.outputs.version }}-x64.exe"
          ls -la dist-release

      - name: Generate changelog
        shell: bash
        run: |
          LATEST="${{ steps.ver.outputs.latest }}"
          {
            echo "## 창 관리자 ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "### 변경 이력"
            echo ""
            if [ -z "$LATEST" ]; then
              echo "최초 릴리스입니다. 전체 커밋 내역:"
              echo ""
              git log HEAD --pretty=format:'- %s (%h)'
            else
              echo "변경 범위: \`${LATEST}\` → \`${{ steps.ver.outputs.tag }}\`"
              echo ""
              LOG="$(git log "${LATEST}..HEAD" --pretty=format:'- %s (%h)')"
              if [ -z "$LOG" ]; then echo "- (이전 릴리스 이후 새로운 커밋 없음)"; else echo "$LOG"; fi
            fi
            echo ""
            echo ""
            echo "### 다운로드"
            echo ""
            echo "- \`WinTamer-${{ steps.ver.outputs.version }}-x64.exe\` — Windows x64 단독 실행 파일 (WebView2 런타임 필요, Win10/11 기본 포함)"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 창 관리자 ${{ steps.ver.outputs.tag }}
          body_path: CHANGELOG_RELEASE.md
          files: dist-release/*.exe
          fail_on_unmatched_files: true
